<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>AG-UI Chat</title>
	<link rel="Stylesheet" href="/index.css" type="text/css" />
</head>
<body>
	<div id="conversation-toolbar">
		<select id="conversation-select" title="Select conversation"></select>
		<button id="new-conversation-btn" type="button" title="New conversation">&#10133;</button>
		<button id="delete-conversation-btn" type="button" title="Delete selected conversation">&#128465;</button>
	</div>
	<div id="messages"></div>
	<div id="input-row">
		<button id="attach-btn" type="button" title="Attach File">&#128206;</button>
		<input id="file-input" type="file" multiple style="display: none;" />

		<textarea id="input" placeholder="Type a message…" rows="1" autocomplete="off"></textarea>
		<button id="send">Send</button>
	</div>
	<div id="attachment-preview-container" style="display: flex; gap: 0.5rem; padding: 0 1rem 0.5rem 1rem;"></div>
	<script type="module" src="/agui-client.js"></script>
</body>
</html>
